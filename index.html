<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>みゃ～ざわ～くす</title>
  <meta name="description" content="みゃ～ざわの活動をまとめたサイトです">
  <meta name="theme-color" content="#42c5a4">

  <!-- タブのアイコン -->
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="images/favicon-64.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <!-- SNSで共有されたときのカード（画像のアドレスは、公開先のアドレスで書く必要があります） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="みゃ～ざわ～くす">
  <meta property="og:title" content="みゃ～ざわ～くす">
  <meta property="og:description" content="みゃ～ざわの活動をまとめたサイトです">
  <meta property="og:url" content="https://myaaazawa.github.io/">
  <meta property="og:image" content="https://myaaazawa.github.io/images/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="みゃ～ざわのアバターと、サイト名「みゃ～ざわ～くす」">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@Miyazawa2020">

  <link rel="stylesheet" href="style.css">
  <script>
    // 前に選んだ明るさを、表示する前に戻す（一瞬ちがう色で光らないように）
    try {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <main class="page">
    <button id="theme-toggle" class="theme-toggle" type="button">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <!-- タイトル・説明文 -->
    <header class="intro">
      <h1 id="site-title"></h1>
      <p id="site-lead" class="lead"></p>
    </header>

    <!-- アバターと会話 -->
    <section class="talk" aria-label="アバターとの会話">
      <div class="avatar-frame">
        <button id="avatar-prev" class="avatar-nav avatar-nav-prev" type="button">
          <span class="avatar-nav-faces"></span><span class="avatar-nav-arrow" aria-hidden="true">‹</span>
        </button>
        <!-- アバター（1人または2人）。中身は script.js が作る -->
        <div id="avatar-stage" class="avatar-stage"></div>
        <button id="avatar-next" class="avatar-nav avatar-nav-next" type="button">
          <span class="avatar-nav-faces"></span><span class="avatar-nav-arrow" aria-hidden="true">›</span>
        </button>
      </div>
      <div class="message-window">
        <div id="speaker" class="speaker"></div>
        <button id="sound-toggle" class="sound-toggle" type="button">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none"/></svg>
        </button>
        <p id="message" class="message" aria-live="polite"></p>
        <div id="next-mark" class="next-mark" aria-hidden="true">▼</div>
        <div id="choices" class="choices"></div>
      </div>
    </section>

    <!-- 自己紹介 -->
    <section class="profile" aria-labelledby="profile-heading">
      <h2 id="profile-heading">自己紹介</h2>
      <div id="profile-body"></div>
    </section>

    <!-- アプリ -->
    <section class="apps" aria-labelledby="apps-heading">
      <h2 id="apps-heading">アプリ</h2>
      <ul id="app-list" class="app-list"></ul>
    </section>

    <!-- リンク一覧 -->
    <section class="links" aria-labelledby="links-heading">
      <h2 id="links-heading">リンク</h2>
      <ul id="link-list" class="link-list"></ul>
    </section>

    <footer class="footer">
      <small id="footer-text"></small>
    </footer>
  </main>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
